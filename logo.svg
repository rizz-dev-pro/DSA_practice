  <circle cx="52" cy="50" r="5" fill="#c7d2fe"/>
  <circle cx="32" cy="17" r="6.5" fill="#fff"/>
  <circle cx="45" cy="34" r="6" fill="#fff"/>
  <circle cx="38" cy="50" r="6.5" fill="#fbbf24"/>
  <circle cx="38" cy="50" r="2.4" fill="#6d28d9"/>
  </g>
